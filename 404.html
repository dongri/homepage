<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Dongri Jin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Press+Start+2P&display=swap"
    rel="stylesheet">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #111;
      --muted: #666;
      --faint: #9a9a9a;
      --line: #ececec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --fg: #ededed;
        --muted: #a1a1a1;
        --faint: #6b6b6b;
        --line: #232325;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      max-width: 38rem;
      margin: 0 auto;
      padding: 4rem 1.25rem;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--faint);
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-color: currentColor;
    }

    /* game */

    .game {
      width: 100%;
      display: flex;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .game canvas {
      display: block;
      border-radius: 6px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.6rem 0 2.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--faint);
    }

    .controls button {
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .controls button:hover {
      color: var(--fg);
    }

    /* text */

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--faint);
      margin: 0 0 0.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }

    .message {
      color: var(--muted);
      margin: 0 0 2rem;
    }

    .home {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--fg);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .home:hover {
      border-color: var(--faint);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="game" tabindex="0" role="application"
    aria-label="Mini game: press Space or tap to jump, hold to jump higher">
    <canvas></canvas>
  </div>
  <div class="controls">
    <span>Hold to jump higher</span>
    <button type="button" class="sound">♪ Sound on</button>
  </div>

  <p class="label">404 · Not Found</p>
  <h1>This page waddled off.</h1>
  <p class="message">
    It's off on an 8-bit adventure.<br>
    Play a round, or waddle back home.
  </p>

  <a class="home" href="/">← Back to home</a>

  <script>
    (() => {
      const game = document.querySelector('.game');
      const canvas = game.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const controls = document.querySelector('.controls');
      const soundBtn = controls.querySelector('.sound');

      // world (internal pixels)
      const H = 96;
      const GY = 80;
      const PX = 24;
      const GRAVITY = 900;
      const JUMP = 300;
      const JUMP_CUT = 110;
      const FONT = '8px "Press Start 2P"';

      // ---------- sprites ----------

      function sprite(rows, pal) {
        const w = Math.max(...rows.map((r) => r.length));
        const c = document.createElement('canvas');
        c.width = w;
        c.height = rows.length;
        const g = c.getContext('2d');
        rows.forEach((row, y) => {
          [...row].forEach((ch, x) => {
            if (!pal[ch]) return;
            g.fillStyle = pal[ch];
            g.fillRect(x, y, 1, 1);
          });
        });
        return c;
      }

      function draw(w, h, fn) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        fn(c.getContext('2d'));
        return c;
      }

      const PENGUIN = {
        k: '#111', g: '#3d4350', w: '#fff', h: '#8a93a0', y: '#ffc83d',
      };
      const head = [
        '......kkkk......',
        '....kkggggkk....',
        '...kggggggggk...',
        '..kggggggggggk..',
        '..kwwwwwgwwwwwk.',
        '..kwhkkwgwhkkwk.',
        '..kwwwwwgwwwwwk.',
        '..kgggggyyyggk..',
        '...kggggggyggk..',
      ];
      const deadHead = [
        '......kkkk......',
        '....kkggggkk....',
        '...kggggggggk...',
        '..kggggggggggk..',
        '..kgkgkggkgkgk..',
        '..kggkggggkggk..',
        '..kgkgkggkgkgk..',
        '..kgggggyyyggk..',
        '...kggggyyyggk..',
      ];
      const bodyDown = [
        '...kgwwwwwwgk...',
        '..kggwwwwwwggk..',
        '.kggwwwwwwwwggk.',
        '.kgkwwwwwwwwkgk.',
        '..kkwwwwwwwwkk..',
        '...kkwwwwwwkk...',
      ];
      const bodyUp = [
        'kk.kgwwwwwwgk.kk',
        '.kkggwwwwwwggkk.',
        '..kggwwwwwwggk..',
        '..kgwwwwwwwwgk..',
        '..kkwwwwwwwwkk..',
        '...kkwwwwwwkk...',
      ];
      const P = {
        stand: sprite([...head, ...bodyDown, '...yyy....yyy...'], PENGUIN),
        run1: sprite([...head, ...bodyDown, '..yyy......yy...'], PENGUIN),
        run2: sprite([...head, ...bodyDown, '....yy....yyy...'], PENGUIN),
        jump: sprite([...head, ...bodyUp, '....yy....yy....'], PENGUIN),
        dead: sprite([...deadHead, ...bodyUp, '....yy....yy....'], PENGUIN),
      };

      const COIN = { k: '#5a3a00', y: '#ffcf3a', o: '#d99a10', w: '#fff6c8' };
      const coinFrames = [
        sprite([
          '..kkkk..',
          '.kyyyyk.',
          'kyywyyok',
          'kyywyyok',
          'kyywyyok',
          'kyywyyok',
          '.kyyyok.',
          '..kkkk..',
        ], COIN),
        sprite([
          '...kk...',
          '..kyyk..',
          '..kwok..',
          '..kwok..',
          '..kwok..',
          '..kwok..',
          '..kyok..',
          '...kk...',
        ], COIN),
        sprite([
          '...kk...',
          '...ko...',
          '...ko...',
          '...ko...',
          '...ko...',
          '...ko...',
          '...ko...',
          '...kk...',
        ], COIN),
      ];
      coinFrames.push(coinFrames[1]);

      const crate = draw(16, 16, (g) => {
        g.fillStyle = '#5a3510';
        g.fillRect(0, 0, 16, 16);
        g.fillStyle = '#c98a3a';
        g.fillRect(1, 1, 14, 14);
        g.fillStyle = '#e8b56a';
        g.fillRect(1, 1, 14, 1);
        g.fillRect(1, 1, 1, 14);
        g.fillStyle = '#7a4a18';
        for (let i = 2; i < 14; i++) {
          g.fillRect(i, i, 1, 1);
          g.fillRect(15 - i, i, 1, 1);
        }
        g.fillRect(3, 3, 10, 1);
        g.fillRect(3, 12, 10, 1);
      });

      const spike = draw(16, 8, (g) => {
        for (let x = 0; x < 16; x++) {
          const l = x % 4;
          const h = (l < 2 ? l + 1 : 4 - l) * 2;
          g.fillStyle = '#b8bec7';
          g.fillRect(x, 8 - h, 1, h);
          g.fillStyle = '#4a505a';
          g.fillRect(x, 8 - h, 1, 1);
        }
        g.fillStyle = '#4a505a';
        g.fillRect(0, 7, 16, 1);
      });

      const PALETTES = {
        day: {
          sky: '#7ab8ff', cloud: '#fff', cloudLine: '#a8cfff', hill: '#4cb648', hillDark: '#2e7d32',
          brick: '#c86f30', mortar: '#5a2a0e', brickHi: '#eba06a', star: null,
        },
        night: {
          sky: '#16183a', cloud: '#3a3f66', cloudLine: '#2a2e52', hill: '#2c6e3a', hillDark: '#1b4a26',
          brick: '#9a5426', mortar: '#3a1a08', brickHi: '#c27a48', star: '#e8ecff',
        },
      };

      function hill(w, h, pal) {
        return draw(w, h, (g) => {
          for (let x = 0; x < w; x++) {
            const dx = (x + 0.5 - w / 2) / (w / 2);
            const top = h - Math.round(h * Math.sqrt(Math.max(0, 1 - dx * dx)));
            g.fillStyle = pal.hill;
            g.fillRect(x, top, 1, h - top);
            g.fillStyle = pal.hillDark;
            g.fillRect(x, top, 1, 1);
          }
          g.fillStyle = pal.hillDark;
          g.fillRect(Math.round(w * 0.35), Math.round(h * 0.45), 2, 4);
          g.fillRect(Math.round(w * 0.6), Math.round(h * 0.35), 2, 4);
          g.fillRect(Math.round(w * 0.5), Math.round(h * 0.7), 2, 4);
        });
      }

      function buildScene(pal) {
        return {
          pal,
          cloud: sprite([
            '..........cccc........',
            '........ccwwwwcc......',
            '....cccwwwwwwwwwc.....',
            '...cwwwwwwwwwwwwwcccc.',
            '.ccwwwwwwwwwwwwwwwwwwc',
            'cwwwwwwwwwwwwwwwwwwwwc',
            'cwwwwwwwwwwwwwwwwwwwwc',
            '.cccccccccccccccccccc.',
          ], { c: pal.cloudLine, w: pal.cloud }),
          hillBig: hill(64, 28, pal),
          hillSmall: hill(40, 16, pal),
          brick: draw(16, 16, (g) => {
            g.fillStyle = pal.brick;
            g.fillRect(0, 0, 16, 16);
            g.fillStyle = pal.brickHi;
            g.fillRect(0, 0, 16, 1);
            g.fillRect(0, 8, 16, 1);
            g.fillStyle = pal.mortar;
            g.fillRect(0, 7, 16, 1);
            g.fillRect(0, 15, 16, 1);
            g.fillRect(15, 0, 1, 7);
            g.fillRect(7, 8, 1, 7);
          }),
        };
      }

      const stars = Array.from({ length: 24 }, () => ({
        x: Math.random() * 240,
        y: 4 + Math.random() * 56,
      }));

      const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
      let scene = buildScene(darkMq.matches ? PALETTES.night : PALETTES.day);
      darkMq.addEventListener('change', (e) => {
        scene = buildScene(e.matches ? PALETTES.night : PALETTES.day);
      });

      // ---------- sound ----------

      let audio = null;
      let soundOn = true;
      try {
        soundOn = localStorage.getItem('penguin-sound') !== 'off';
      } catch (e) { }

      function renderSoundBtn() {
        soundBtn.textContent = soundOn ? '♪ Sound on' : '♪ Sound off';
      }

      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        renderSoundBtn();
        try {
          localStorage.setItem('penguin-sound', soundOn ? 'on' : 'off');
        } catch (e) { }
      });

      function tone(f1, f2, dur, when = 0, type = 'square', vol = 0.05) {
        if (!soundOn || !audio) return;
        const t0 = audio.currentTime + when;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, t0);
        if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain).connect(audio.destination);
        osc.start(t0);
        osc.stop(t0 + dur);
      }

      const sfx = {
        jump: () => tone(260, 620, 0.16),
        coin: () => {
          tone(1047, 1047, 0.06);
          tone(1568, 1568, 0.2, 0.06);
        },
        die: () => {
          tone(523, 523, 0.12, 0);
          tone(392, 392, 0.12, 0.13);
          tone(311, 311, 0.12, 0.26);
          tone(196, 196, 0.4, 0.39, 'triangle', 0.08);
        },
      };

      function unlockAudio() {
        if (!audio) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audio = new AC();
        }
        if (audio && audio.state === 'suspended') audio.resume();
      }

      // ---------- game state ----------

      let W = 160;
      let state = 'idle';
      let h = 0;
      let vy = 0;
      let camX = 0;
      let speed = 0;
      let dist = 0;
      let coins = 0;
      let obstacles = [];
      let coinItems = [];
      let nextX = 0;
      let overAt = 0;
      let t = 0;
      let last = performance.now();
      let hi = 0;

      try {
        hi = Number(localStorage.getItem('penguin-8bit-hi')) || 0;
      } catch (e) { }

      const rand = (min, max) => min + Math.random() * (max - min);
      const pad = (n, len) => String(n).padStart(len, '0');
      const score = () => Math.floor(dist / 5) + coins * 50;

      function resize() {
        const cw = game.clientWidth;
        const scale = cw >= 480 ? 3 : 2;
        W = Math.max(140, Math.floor(cw / scale));
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = `${W * scale}px`;
        canvas.style.height = `${H * scale}px`;
        controls.style.maxWidth = `${W * scale}px`;
      }

      function spawn(x) {
        const r = Math.random();
        let o;
        if (r < 0.4) o = { x, type: 'spike', w: 16, h: 8 };
        else if (r < 0.8 || dist < 400) o = { x, type: 'crate', w: 16, h: 16 };
        else o = { x, type: 'crate', w: 16, h: 32 };
        obstacles.push(o);

        if (Math.random() < 0.5) {
          const cx = x + o.w / 2 - 4;
          coinItems.push({ x: cx - 12, y: 34 }, { x: cx, y: 24 }, { x: cx + 12, y: 34 });
        }
        nextX = x + o.w + rand(70, 140) + speed * 0.4;
      }

      function start() {
        state = 'running';
        h = 0;
        vy = 0;
        camX = 0;
        speed = 80;
        dist = 0;
        coins = 0;
        obstacles = [];
        coinItems = [];
        nextX = W + 40;
      }

      function jump() {
        vy = JUMP;
        sfx.jump();
      }

      function die() {
        state = 'dying';
        vy = 220;
        sfx.die();
        if (score() > hi) {
          hi = score();
          try {
            localStorage.setItem('penguin-8bit-hi', hi);
          } catch (e) { }
        }
      }

      function overlaps(a, b) {
        return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
      }

      function update(dt) {
        if (state === 'running') {
          speed = Math.min(speed + 3 * dt, 170);
          camX += speed * dt;
          dist += speed * dt;

          vy -= GRAVITY * dt;
          h += vy * dt;
          if (h <= 0) {
            h = 0;
            vy = 0;
          }

          while (nextX < camX + W + 32) spawn(nextX);
          obstacles = obstacles.filter((o) => o.x + o.w > camX - 16);
          coinItems = coinItems.filter((c) => !c.taken && c.x + 8 > camX - 16);

          const me = {
            x1: camX + PX + 3, x2: camX + PX + 13,
            y1: GY - 16 - h + 2, y2: GY - h,
          };
          for (const c of coinItems) {
            if (overlaps(me, { x1: c.x, x2: c.x + 8, y1: c.y, y2: c.y + 8 })) {
              c.taken = true;
              coins++;
              sfx.coin();
            }
          }
          for (const o of obstacles) {
            const box = o.type === 'spike'
              ? { x1: o.x + 2, x2: o.x + 14, y1: GY - 6, y2: GY }
              : { x1: o.x, x2: o.x + o.w, y1: GY - o.h, y2: GY };
            if (overlaps(me, box)) {
              die();
              break;
            }
          }
        } else if (state === 'dying') {
          vy -= GRAVITY * dt;
          h += vy * dt;
          if (GY - 16 - h > H + 4) {
            state = 'over';
            overAt = performance.now();
          }
        }
      }

      // ---------- render ----------

      function tile(img, baseX, y, parallax, period) {
        let x = (((baseX - camX * parallax) % period) + period) % period - period;
        for (; x < W; x += period) ctx.drawImage(img, Math.round(x), y);
      }

      function text(str, x, y, align = 'left') {
        ctx.font = FONT;
        ctx.textBaseline = 'top';
        ctx.textAlign = align;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillText(str, x + 1, y + 1);
        ctx.fillStyle = '#fff';
        ctx.fillText(str, x, y);
      }

      function render() {
        const { pal } = scene;
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = pal.sky;
        ctx.fillRect(0, 0, W, H);

        if (pal.star) {
          ctx.fillStyle = pal.star;
          for (const s of stars) {
            const x = (((s.x - camX * 0.1) % 240) + 240) % 240;
            if (x < W) ctx.fillRect(Math.round(x), Math.round(s.y), 1, 1);
          }
        }

        tile(scene.cloud, 30, 24, 0.25, 220);
        tile(scene.cloud, 140, 36, 0.25, 220);
        tile(scene.hillBig, 20, GY - 28, 0.5, 260);
        tile(scene.hillSmall, 170, GY - 16, 0.5, 260);

        const off = Math.floor(camX) % 16;
        for (let x = -off; x < W; x += 16) ctx.drawImage(scene.brick, x, GY);

        const coinImg = coinFrames[Math.floor(t * 8) % 4];
        for (const c of coinItems) {
          if (!c.taken) ctx.drawImage(coinImg, Math.round(c.x - camX), c.y);
        }

        for (const o of obstacles) {
          const sx = Math.round(o.x - camX);
          if (o.type === 'spike') {
            ctx.drawImage(spike, sx, GY - 8);
          } else {
            for (let y = GY - 16; y >= GY - o.h; y -= 16) ctx.drawImage(crate, sx, y);
          }
        }

        if (state !== 'over') {
          let img = P.stand;
          if (state === 'dying') img = P.dead;
          else if (state === 'running') img = h > 0 ? P.jump : (Math.floor(dist / 10) % 2 ? P.run1 : P.run2);
          ctx.drawImage(img, PX, Math.round(GY - 16 - h));
        }

        // HUD
        text('SCORE', 6, 4);
        text(pad(state === 'idle' ? 0 : score(), 6), 6, 13);
        ctx.drawImage(coinFrames[0], Math.round(W / 2) - 16, 9);
        text(`x${pad(coins, 2)}`, Math.round(W / 2) - 6, 9);
        text('WORLD', W - 6, 4, 'right');
        text('4-04', W - 6, 13, 'right');

        const blink = Math.floor(t * 2) % 2 === 0;
        const prompt = W >= 150 ? 'PRESS SPACE OR TAP' : 'TAP TO PLAY';
        if (state === 'idle') {
          text('PAGE NOT FOUND', W / 2, 30, 'center');
          if (blink) text(prompt, W / 2, 44, 'center');
          if (hi > 0) text(`HI ${pad(hi, 6)}`, W / 2, 56, 'center');
        } else if (state === 'over') {
          text('GAME OVER', W / 2, 30, 'center');
          if (blink) text(prompt, W / 2, 44, 'center');
          text(`HI ${pad(hi, 6)}`, W / 2, 56, 'center');
        }
      }

      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        t += dt;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      // ---------- input ----------

      function press() {
        unlockAudio();
        if (state === 'running') {
          if (h === 0) jump();
        } else if (state === 'idle' || (state === 'over' && performance.now() - overAt > 400)) {
          start();
          jump();
        }
      }

      function release() {
        if (state === 'running' && vy > JUMP_CUT) vy = JUMP_CUT;
      }

      const isJumpKey = (e) => e.code === 'Space' || e.code === 'ArrowUp';
      const fromControl = (e) => e.target.closest && e.target.closest('a, button');

      document.addEventListener('keydown', (e) => {
        if (!isJumpKey(e) || fromControl(e)) return;
        e.preventDefault();
        if (!e.repeat) press();
      });
      document.addEventListener('keyup', (e) => {
        if (!isJumpKey(e) || fromControl(e)) return;
        release();
      });
      game.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        press();
      });
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
      window.addEventListener('resize', resize);

      if (document.fonts) document.fonts.load(FONT);
      renderSoundBtn();
      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>
